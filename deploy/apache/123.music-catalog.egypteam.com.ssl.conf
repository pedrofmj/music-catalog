<VirtualHost *:443>
	ServerName music-catalog.egypteam.com
	ServerAlias www.music-catalog.egypteam.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.music-catalog.egypteam.com.log
	CustomLog ${APACHE_LOG_DIR}/access.music-catalog.egypteam.com.log combined

	RewriteEngine on
	ProxyPass / http://192.168.49.2:30230/
	ProxyPassReverse / http://192.168.49.2:30230/
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto https
	RequestHeader set X-Forwarded-Prefix /

	SSLCertificateFile /etc/letsencrypt/live/egypteam.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/egypteam.com/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

