apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-catalog
  namespace: music-catalog
  labels:
    app.kubernetes.io/name: music-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: music-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-catalog
    spec:
      containers:
        - name: web
          image: music-catalog:deploy
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL