name: Deploy image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build image
        run: docker build -t music-catalog:deploy .
      - name: Export image tarball
        run: docker save music-catalog:deploy | gzip > music-catalog-deploy.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: music-catalog-image
          path: music-catalog-deploy.tar.gz
          retention-days: 14